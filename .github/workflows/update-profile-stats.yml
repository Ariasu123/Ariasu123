name: Update profile statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * 1"

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: true

jobs:
  update-statistics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate development metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Ariasu123
        run: python scripts/update_stats.py

      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity.svg

          if git diff --cached --quiet; then
            echo "No statistics changed."
            exit 0
          fi

          git commit -m "chore(profile): 更新开发指标"
          git push
