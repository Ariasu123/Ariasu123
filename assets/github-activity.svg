<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title description">
  <title id="title">Ariasu123 development metrics</title>
  <desc id="description">Automatically updated public GitHub statistics, language usage, and contribution streaks.</desc>
  <defs>
    <clipPath id="language-bar"><rect x="535" y="94" width="405" height="8" rx="4"/></clipPath>
  </defs>
  <style>
    .section-title { font: 500 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #58a6ff; }
    .stat-label, .stat-value { font: 600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #e6edf3; }
    .legend-label { font: 400 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #e6edf3; }
    .legend-value { font: 700 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #e6edf3; }
    .metric-number { font: 700 25px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #58a6ff; }
    .metric-label { font: 600 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #e6edf3; }
  </style>
  <rect width="1000" height="340" rx="16" fill="#0d1117"/>
  <rect x="18" y="18" width="964" height="304" rx="12" fill="none" stroke="#30363d"/>
  <text x="40" y="55" class="section-title">GitHub Stats</text>
  <text x="535" y="55" class="section-title">Most Used Languages</text>
  <line x1="500" y1="38" x2="500" y2="222" stroke="#30363d"/>

    <circle cx="40" cy="85" r="4" fill="#58a6ff"/>
    <text x="55" y="90" class="stat-label">Total stars earned</text>
    <text x="455" y="90" text-anchor="end" class="stat-value">1</text>


    <circle cx="40" cy="115" r="4" fill="#58a6ff"/>
    <text x="55" y="120" class="stat-label">Total commits</text>
    <text x="455" y="120" text-anchor="end" class="stat-value">327</text>


    <circle cx="40" cy="145" r="4" fill="#58a6ff"/>
    <text x="55" y="150" class="stat-label">Total pull requests</text>
    <text x="455" y="150" text-anchor="end" class="stat-value">8</text>


    <circle cx="40" cy="175" r="4" fill="#58a6ff"/>
    <text x="55" y="180" class="stat-label">Total issues</text>
    <text x="455" y="180" text-anchor="end" class="stat-value">1</text>


    <circle cx="40" cy="205" r="4" fill="#58a6ff"/>
    <text x="55" y="210" class="stat-label">Contributions this year</text>
    <text x="455" y="210" text-anchor="end" class="stat-value">386</text>

  <rect x="535" y="94" width="405" height="8" rx="4" fill="#161b22"/>
  <g clip-path="url(#language-bar)"><rect x="535.00" y="94" width="183.65" height="8" fill="#3572A5"/>
<rect x="718.65" y="94" width="96.32" height="8" fill="#3178c6"/>
<rect x="814.98" y="94" width="58.84" height="8" fill="#e34c26"/>
<rect x="873.82" y="94" width="39.70" height="8" fill="#fcb32c"/>
<rect x="913.51" y="94" width="10.14" height="8" fill="#f1e05a"/>
<rect x="923.65" y="94" width="16.35" height="8" fill="#8b949e"/></g>

            <circle cx="539" cy="128" r="4" fill="#3572A5"/>
            <text x="551" y="132" class="legend-label">Python</text>
            <text x="720" y="132" text-anchor="end" class="legend-value">45.3%</text>


            <circle cx="744" cy="128" r="4" fill="#3178c6"/>
            <text x="756" y="132" class="legend-label">TypeScript</text>
            <text x="925" y="132" text-anchor="end" class="legend-value">23.8%</text>


            <circle cx="539" cy="158" r="4" fill="#e34c26"/>
            <text x="551" y="162" class="legend-label">HTML</text>
            <text x="720" y="162" text-anchor="end" class="legend-value">14.5%</text>


            <circle cx="744" cy="158" r="4" fill="#fcb32c"/>
            <text x="756" y="162" class="legend-label">MDX</text>
            <text x="925" y="162" text-anchor="end" class="legend-value">9.8%</text>


            <circle cx="539" cy="188" r="4" fill="#f1e05a"/>
            <text x="551" y="192" class="legend-label">JavaScript</text>
            <text x="720" y="192" text-anchor="end" class="legend-value">2.5%</text>


            <circle cx="744" cy="188" r="4" fill="#8b949e"/>
            <text x="756" y="192" class="legend-label">Other</text>
            <text x="925" y="192" text-anchor="end" class="legend-value">4.0%</text>

  <line x1="333" y1="238" x2="333" y2="305" stroke="#30363d"/>
  <line x1="667" y1="238" x2="667" y2="305" stroke="#30363d"/>
  <text x="167" y="273" text-anchor="middle" class="metric-number">482</text>
  <text x="167" y="299" text-anchor="middle" class="metric-label">Total contributions</text>
  <text x="500" y="273" text-anchor="middle" class="metric-number">2</text>
  <text x="500" y="299" text-anchor="middle" class="metric-label">Current streak</text>
  <text x="834" y="273" text-anchor="middle" class="metric-number">16</text>
  <text x="834" y="299" text-anchor="middle" class="metric-label">Longest streak</text>
</svg>
